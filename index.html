
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CIVIZ | Quiz Practice</title>

  <!-- =====================================================
       SECTION 1: WEBSITE DESIGN (CSS)
       Change colours, fonts, spacing and layout here.
       No need to edit this section to add quiz questions.
  ====================================================== -->
  <style>
    :root {
      --primary: #176b52;
      --primary-dark: #10513e;
      --background: #f4f7f5;
      --surface: #ffffff;
      --text: #1c2924;
      --muted: #68776f;
      --border: #dce5df;
      --correct: #e4f6e9;
      --wrong: #fff0ed;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: var(--primary-dark);
      color: white;
      padding: 22px 16px;
    }

    .header-inner,
    main,
    footer {
      width: min(900px, 92%);
      margin: auto;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 1px;
    }

    header p {
      margin: 4px 0 0;
      color: #d7eee4;
    }

    main {
      padding: 28px 0 40px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 14px #173a2710;
    }

    h2, h3 {
      line-height: 1.35;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    select, button {
      font: inherit;
      border-radius: 8px;
      padding: 11px 13px;
    }

    select {
      width: 100%;
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .primary-btn {
      background: var(--primary);
      color: white;
    }

    .primary-btn:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .secondary-btn {
      background: #eaf0ec;
      color: var(--text);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .actions button {
      flex: 1;
      min-width: 130px;
    }

    .muted {
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 14px;
    }

    .progress-track {
      background: #e8eeea;
      height: 8px;
      border-radius: 20px;
      overflow: hidden;
      margin: 14px 0 22px;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: var(--primary);
      transition: width 0.2s ease;
    }

    #questionText {
      font-size: 20px;
      margin: 18px 0;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px;
      margin: 10px 0;
      cursor: pointer;
      font-weight: normal;
    }

    .option:hover {
      border-color: var(--primary);
      background: #f6faf7;
    }

    .option input {
      margin-top: 6px;
      accent-color: var(--primary);
    }

    .option.correct {
      background: var(--correct);
      border-color: #3b9a59;
    }

    .option.incorrect {
      background: var(--wrong);
      border-color: #d66b5b;
    }

    #feedback {
      padding: 14px;
      border-radius: 9px;
      margin-top: 16px;
      white-space: pre-wrap;
    }

    #feedback.good {
      background: var(--correct);
    }

    #feedback.bad {
      background: var(--wrong);
    }

    .score {
      font-size: 34px;
      font-weight: bold;
      color: var(--primary);
    }

    footer {
      color: var(--muted);
      text-align: center;
      padding: 10px 0 28px;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      header h1 {
        font-size: 23px;
      }

      .panel {
        padding: 17px;
      }

      #questionText {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       SECTION 2: WEBSITE HEADER
       Change the brand name or subtitle here.
  ====================================================== -->
  <header>
    <div class="header-inner">
      <h1>CIVIZ</h1>
      <p>Engineering Beyond Textbooks | Quiz Practice</p>
    </div>
  </header>

  <main>

    <!-- ===================================================
         SECTION 3: TOPIC SELECTION
         Topics are loaded from quizzes/manifest.json.
         Add topics to that file, not to this HTML.
    ==================================================== -->
    <section class="panel" id="topicPanel">
      <h2>Choose Your Quiz</h2>
      <p class="muted">
        Select a topic, practise the questions and check your
        answers with explanations.
      </p>

      <label for="topicSelect">Available Topics</label>
      <select id="topicSelect">
        <option value="">Loading topics...</option>
      </select>

      <p id="topicDescription" class="muted"></p>

      <button id="startBtn" class="primary-btn" disabled>
        Start Quiz
      </button>
    </section>

    <!-- ===================================================
         SECTION 4: QUIZ AREA
         JavaScript inserts questions and answer options here.
         Do not manually add questions in this section.
    ==================================================== -->
    <section class="panel hidden" id="quizPanel">

      <div class="quiz-meta">
        <span id="quizTitle"></span>
        <span id="questionCounter"></span>
        <span id="scoreCounter">Score: 0</span>
      </div>

      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <h2 id="questionText"></h2>

      <div id="optionsContainer"></div>

      <div id="feedback" class="hidden" aria-live="polite"></div>

      <div class="actions">
        <button id="submitBtn" class="primary-btn">
          Check Answer
        </button>

        <button id="nextBtn" class="primary-btn hidden">
          Next Question
        </button>
      </div>

    </section>

    <!-- ===================================================
         SECTION 5: RESULTS
         Displays the final score and restart options.
    ==================================================== -->
    <section class="panel hidden" id="resultPanel">
      <h2>Quiz Completed!</h2>

      <p>Your final score:</p>
      <div class="score" id="finalScore"></div>
      <p id="resultMessage"></p>

      <div class="actions">
        <button id="retryBtn" class="primary-btn">
          Try Again
        </button>

        <button id="chooseAnotherBtn" class="secondary-btn">
          Choose Another Topic
        </button>
      </div>
    </section>

    <!-- ===================================================
         SECTION 6: STATUS AND ERROR MESSAGES
         Shows loading problems and missing file errors.
    ==================================================== -->
    <p id="statusMessage" class="muted" role="status"
       aria-live="polite"></p>

  </main>

  <!-- =====================================================
       SECTION 7: FOOTER
       Edit the footer text here if required.
  ====================================================== -->
  <footer>
    CIVIZ — Learn. Build. Innovate.
  </footer>

  <!-- =====================================================
       SECTION 8: QUIZ ENGINE (JAVASCRIPT)
       Loads the topic catalog, loads selected JSON files,
       checks answers and calculates the score.
       Normally, you do not need to edit this section.
  ====================================================== -->
  <script>
    // -----------------------------------------------------
    // 8.1: FILE LOCATIONS
    // If you move your JSON files, update these paths.
    // -----------------------------------------------------
    const MANIFEST_URL = "./quizzes/manifest.json";

    // -----------------------------------------------------
    // 8.2: HTML ELEMENT REFERENCES
    // -----------------------------------------------------
    const topicSelect = document.getElementById("topicSelect");
    const topicDescription = document.getElementById("topicDescription");
    const startBtn = document.getElementById("startBtn");

    const topicPanel = document.getElementById("topicPanel");
    const quizPanel = document.getElementById("quizPanel");
    const resultPanel = document.getElementById("resultPanel");

    const quizTitle = document.getElementById("quizTitle");
    const questionCounter = document.getElementById("questionCounter");
    const scoreCounter = document.getElementById("scoreCounter");
    const progressBar = document.getElementById("progressBar");
    const questionText = document.getElementById("questionText");
    const optionsContainer = document.getElementById("optionsContainer");
    const feedback = document.getElementById("feedback");

    const submitBtn = document.getElementById("submitBtn");
    const nextBtn = document.getElementById("nextBtn");

    const finalScore = document.getElementById("finalScore");
    const resultMessage = document.getElementById("resultMessage");
    const retryBtn = document.getElementById("retryBtn");
    const chooseAnotherBtn = document.getElementById("chooseAnotherBtn");
    const statusMessage = document.getElementById("statusMessage");

    // -----------------------------------------------------
    // 8.3: QUIZ STATE
    // These values track the current quiz session.
    // -----------------------------------------------------
    let topics = [];
    let currentQuiz = null;
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    // -----------------------------------------------------
    // 8.4: HELPER FUNCTIONS
    // -----------------------------------------------------
    function showStatus(message) {
      statusMessage.textContent = message;
    }

    function hideAllPanels() {
      quizPanel.classList.add("hidden");
      resultPanel.classList.add("hidden");
    }

    async function fetchJSON(url) {
      const response = await fetch(url, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(
          "Could not load " + url + " (HTTP " + response.status + ")."
        );
      }

      return await response.json();
    }

    // -----------------------------------------------------
    // 8.5: LOAD TOPIC CATALOG
    // Reads all quiz entries listed in manifest.json.
    // -----------------------------------------------------
    async function loadTopics() {
      startBtn.disabled = true;
      topicSelect.disabled = true;
      showStatus("Loading available topics...");

      try {
        const manifest = await fetchJSON(MANIFEST_URL);

        if (!manifest || !Array.isArray(manifest.topics)) {
          throw new Error(
            "manifest.json must contain a topics array."
          );
        }

        topics = manifest.topics;

        topicSelect.replaceChildren();

        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "Select a topic...";
        topicSelect.appendChild(placeholder);

        topics.forEach((topic, index) => {
          if (
            !topic ||
            typeof topic.title !== "string" ||
            typeof topic.file !== "string" ||
            !topic.file.endsWith(".json") ||
            topic.file.includes("..") ||
            topic.file.startsWith("/") ||
            topic.file.includes("\\")
          ) {
            console.warn("Skipping invalid topic entry:", index);
            return;
          }

          const option = document.createElement("option");
          option.value = String(index);
          option.textContent = topic.title;
          topicSelect.appendChild(option);
        });

        topicSelect.disabled = false;
        showStatus(
          topicSelect.options.length > 1
            ? "Choose a topic to begin."
            : "No valid quiz topics found. Check manifest.json."
        );

      } catch (error) {
        console.error(error);
        showStatus(
          "Unable to load topics. Check your GitHub file paths " +
          "and make sure GitHub Pages is enabled. " + error.message
        );
        topicSelect.replaceChildren();

        const option = document.createElement("option");
        option.value = "";
        option.textContent = "Topics unavailable";
        topicSelect.appendChild(option);

      } finally {
        topicSelect.disabled = false;
        updateSelectedTopic();
      }
    }

    // -----------------------------------------------------
    // 8.6: UPDATE SELECTED TOPIC DESCRIPTION
    // -----------------------------------------------------
    function updateSelectedTopic() {
      const index = topicSelect.value;

      if (index === "" || !topics[Number(index)]) {
        topicDescription.textContent = "";
        startBtn.disabled = true;
        return;
      }

      const topic = topics[Number(index)];
      topicDescription.textContent = topic.description || "";
      startBtn.disabled = false;
    }

    topicSelect.addEventListener("change", updateSelectedTopic);

    // -----------------------------------------------------
    // 8.7: LOAD THE SELECTED QUIZ JSON
    // -----------------------------------------------------
    async function startQuiz() {
      const selectedIndex = topicSelect.value;

      if (selectedIndex === "") return;

      const topic = topics[Number(selectedIndex)];
      if (!topic) return;

      startBtn.disabled = true;
      showStatus("Loading quiz...");
      hideAllPanels();

      try {
        const quiz = await fetchJSON("./quizzes/" + topic.file);

        if (
          !quiz ||
          !Array.isArray(quiz.questions) ||
          quiz.questions.length === 0
        ) {
          throw new Error(
            "The quiz must contain a non-empty questions array."
          );
        }

        // Validate the entire quiz before starting.
        quiz.questions.forEach((q, i) => {
          if (
            !q ||
            typeof q.question !== "string" ||
            !Array.isArray(q.options) ||
            q.options.length < 2 ||
            !Number.isInteger(q.answerIndex) ||
            q.answerIndex < 0 ||
            q.answerIndex >= q.options.length ||
            !q.options.every(o => typeof o === "string")
          ) {
            throw new Error(
              "Invalid question data at question " + (i + 1) +
              ". Check question, options and answerIndex."
            );
          }
        });

        currentQuiz = quiz;
        currentQuestionIndex = 0;
        score = 0;
        answered = false;

        quizTitle.textContent = quiz.title || topic.title;
        scoreCounter.textContent = "Score: 0";

        topicPanel.classList.add("hidden");
        resultPanel.classList.add("hidden");
        quizPanel.classList.remove("hidden");

        showStatus("");
        renderQuestion();

      } catch (error) {
        console.error(error);
        showStatus(
          "Unable to load this quiz. Check the JSON filename, " +
          "format and question data. " + error.message
        );
      } finally {
        startBtn.disabled = false;
      }
    }

    startBtn.addEventListener("click", startQuiz);

    // -----------------------------------------------------
    // 8.8: DISPLAY CURRENT QUESTION AND OPTIONS
    // Uses textContent to display JSON text safely.
    // -----------------------------------------------------
    function renderQuestion() {
      const q = currentQuiz.questions[currentQuestionIndex];
      answered = false;

      questionCounter.textContent =
        "Question " + (currentQuestionIndex + 1) +
        " of " + currentQuiz.questions.length;

      scoreCounter.textContent = "Score: " + score;

      progressBar.style.width =
        (currentQuestionIndex / currentQuiz.questions.length * 100) + "%";

      questionText.textContent =
        (currentQuestionIndex + 1) + ". " + q.question;

      optionsContainer.replaceChildren();

      q.options.forEach((optionText, index) => {
        const label = document.createElement("label");
        label.className = "option";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "quizAnswer";
        radio.value = String(index);

        const text = document.createElement("span");
        text.textContent = optionText;

        label.append(radio, text);
        optionsContainer.appendChild(label);
      });

      feedback.className = "hidden";
      feedback.textContent = "";

      submitBtn.classList.remove("hidden");
      submitBtn.disabled = false;

      nextBtn.classList.add("hidden");
      nextBtn.textContent =
        currentQuestionIndex === currentQuiz.questions.length - 1
          ? "View Results"
          : "Next Question";
    }

    // -----------------------------------------------------
    // 8.9: CHECK THE SELECTED ANSWER
    // answerIndex in JSON starts from zero:
    // 0 = first option, 1 = second option, etc.
    // -----------------------------------------------------
    function checkAnswer() {
      if (answered) return;

      const selected = document.querySelector(
        'input[name="quizAnswer"]:checked'
      );

      if (!selected) {
        feedback.className = "bad";
        feedback.textContent = "Please select an answer first.";
        return;
      }

      answered = true;

      const q = currentQuiz.questions[currentQuestionIndex];
      const selectedIndex = Number(selected.value);
      const isCorrect = selectedIndex === q.answerIndex;

      if (isCorrect) score++;

      Array.from(optionsContainer.children).forEach((label, index) => {
        const radio = label.querySelector("input");
        radio.disabled = true;

        if (index === q.answerIndex) {
          label.classList.add("correct");
        } else if (index === selectedIndex) {
          label.classList.add("incorrect");
        }
      });

      feedback.className = isCorrect ? "good" : "bad";

      const heading = isCorrect
        ? "Correct answer!"
        : "Incorrect answer.";

      feedback.textContent =
        heading + "\n\nCorrect answer: " +
        q.options[q.answerIndex] +
        (q.explanation ? "\n\nExplanation: " + q.explanation : "");

      scoreCounter.textContent = "Score: " + score;
      progressBar.style.width =
        ((currentQuestionIndex + 1) / currentQuiz.questions.length * 100) + "%";

      submitBtn.classList.add("hidden");
      nextBtn.classList.remove("hidden");
    }

    submitBtn.addEventListener("click", checkAnswer);

    // -----------------------------------------------------
    // 8.10: MOVE TO NEXT QUESTION OR RESULTS
    // -----------------------------------------------------
    function nextQuestion() {
      if (!answered) return;

      currentQuestionIndex++;

      if (currentQuestionIndex >= currentQuiz.questions.length) {
        showResults();
      } else {
        renderQuestion();
      }
    }

    nextBtn.addEventListener("click", nextQuestion);

    // -----------------------------------------------------
    // 8.11: DISPLAY FINAL SCORE
    // -----------------------------------------------------
    function showResults() {
      quizPanel.classList.add("hidden");
      resultPanel.classList.remove("hidden");

      const total = currentQuiz.questions.length;
      const percentage = Math.round((score / total) * 100);

      finalScore.textContent = score + " / " + total;
      resultMessage.textContent =
        "You scored " + percentage + "%." +
        (percentage >= 80
          ? " Great work. Keep practising!"
          : " Review the explanations and try again.");

      progressBar.style.width = "100%";
      showStatus("");
    }

    // -----------------------------------------------------
    // 8.12: RESTART OR SELECT ANOTHER TOPIC
    // -----------------------------------------------------
    retryBtn.addEventListener("click", startQuiz);

    chooseAnotherBtn.addEventListener("click", () => {
      hideAllPanels();
      topicPanel.classList.remove("hidden");
      showStatus("Choose another topic.");
    });

    // -----------------------------------------------------
    // 8.13: INITIALISE WEBSITE
    // Runs once when the page loads.
    // -----------------------------------------------------
    loadTopics();
  </script>

</body>
</html>
